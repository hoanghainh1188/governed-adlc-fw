# Settings of `pnpm server:setup` (D-08 V16, V20; platform/deploy/README.md "Fresh deployment", steps 2-7;
# runbook T11 §3.2). Copy this file OUTSIDE the repository, for example to /srv/sdlc/setup.yaml
# (mode 600), and change every value. It holds paths only, never a secret: a secret whose file is
# not given is asked for at a hidden prompt.

# The env file of step 2. Default: platform/deploy/.env of this checkout.
# env_file: /opt/governed-adlc-fw/platform/deploy/.env

# One key holder per OpenBao key share (BAO_KEY_SHARES in openbao/bootstrap/bootstrap.conf: 3), in
# the order the shares are shown. With a PGP public key for every holder (the default and the
# better way), `init` encrypts each share with its holder's key: the command never sees a share in
# clear. Make the file with `gpg --export --armor <the holder's key ID>`. Give either all three
# keys or none: without them, each holder sees their share in clear, one holder at a time.
key_holders:
  - name: Key holder 1
    pgp_public_key_file: /srv/sdlc/keys/holder-1.asc
  - name: Key holder 2
    pgp_public_key_file: /srv/sdlc/keys/holder-2.asc
  - name: Key holder 3
    pgp_public_key_file: /srv/sdlc/keys/holder-3.asc

# Step 4: the GitHub App (README "Create the GitHub App"); its private key file, mode 600.
github_app:
  client_id: Iv23liEXAMPLE
  private_key_file: /srv/sdlc/secrets/github-app.pem

# Step 4: one entry per model provider of platform/deploy/litellm/config.ctmpl.
# anthropic: the API key from `api_key_file`, or at a hidden prompt when it is left out.
# ollama: the address LiteLLM reaches Ollama at.
model_providers:
  - provider: anthropic
    api_key_file: /srv/sdlc/secrets/anthropic.key
  # - provider: ollama
  #   api_base: http://ollama.internal:11434

# Step 7: the optional parts. Each runs its credentials commands and writes its .env keys.
#   observability      Langfuse (profile observability); asks for the worker's Langfuse key
#   knowledge          the index of project documents (profile knowledge)
#   dashboard-signin   dashboard sign-in with GitHub (needs `dashboard` below)
#   dashboard-actions  actions in the dashboard (needs dashboard-signin)
optional: []
#  - observability
#  - knowledge
#  - dashboard-signin
#  - dashboard-actions

# With dashboard-signin: the public origin, and the GitHub App's client secret
# (`pnpm github-app:create` wrote it to <key file>.client-secret; a hidden prompt without it).
# dashboard:
#   public_origin: https://sdlc.example.com
#   client_secret_file: /srv/sdlc/secrets/github-app.pem.client-secret

# With dashboard-signin and `access` below, public_origin may be left out: it is the proxy's
# https://<hostname>:<port> (one public origin, ADR-M67 §2.8); another value is refused.

# Team access (README "Team access", D-08 V20): the TLS proxy on one LAN port. The command writes
# SDLC_ACCESS_* and SDLC_API_TRUSTED_PROXY in the env file, imports the company CA's certificate
# with `access:tls import` and starts the profile `access` in step 7. A key the env file already
# sets to another value is refused, never overwritten.
# access:
#   hostname: sdlc.example.internal       # a DNS name in the company DNS, never an IP address
#   bind_addr: 192.0.2.10                 # the server's LAN address
#   port: 8443                            # default 8443
#   cli_ips: []                           # optional: IPv4 addresses for the CLI, also in the certificate
#   tls_dir: /etc/sdlc/access-tls         # SDLC_ACCESS_TLS_DIR, outside the repository
#   certificate_folder: /srv/sdlc/access-cert  # ca.pem, server.pem, server-key.pem from the company CA
#                                         # (never a CA key); leave out when tls_dir already holds them

# The runner on its own Docker Engine (README "The runner on its own Docker Engine", steps 3, 4, 6;
# D-08 V20). Set up the runner host first (its Engine must answer at docker_host before step 5).
# The command writes the three keys in step 2, before `configure`, so the key holders meet once;
# step 5 delivers the runner's credentials to the runner host, and step 7 starts the profile
# runner-link instead of sandbox. Then start the runner on the runner host (runner-host.sh up).
# runner_link:
#   link_addr: 10.203.0.1                 # SDLC_RUNNER_LINK_ADDR; a VM with WireGuard: 10.66.0.1
#   source_cidr: 10.203.0.1/32            # SDLC_RUNNER_SOURCE_CIDR; a VM: 10.66.0.2/32
#   docker_host: unix:///run/user/1001/docker.sock   # a VM: ssh://sdlc-runner@10.66.0.2

# Steps 8–13 (README "Fresh deployment" steps 8–13; D-08 V19). All four of tenant, admin,
# project_file and sandbox_image, or none of them. The command bootstraps the tenant and its first
# admin (the token is shown once, then the command logs you in with it), applies the project file
# (`adlc admin project apply`: the project, the team, the agent and the configuration, with
# sandbox_image as sandbox.image) after you check each GitHub ID, and writes the AI record on
# behalf of Person A. It never approves the agent, never issues a team member's token and never
# creates an intent: at the end it prints what stays with each person.
# tenant:
#   slug: acme                            # lower-case letters, digits and -
#   name: Acme
# admin:
#   email: admin@acme.example
#   name: Platform Admin
# project_file: /srv/sdlc/project.yaml    # the V17 file (deploy/project.example.yaml), outside the repo
# sandbox_image: ghcr.io/hoanghainh1188/sandbox-node24@sha256:<64 hex>  # step 10: pnpm images get SANDBOX_NODE24
# The client's consent (handbook Ch.2 §2.5, template T7), recorded on behalf of Person A of the
# project file (QUESTIONS #671). Without it, Person A writes it (step 13).
# ai_record:
#   ai_allowed: yes                       # no | yes | yes_with_conditions
#   classes: [public, internal]           # the data classes the client allows
#   prod_logs: no                         # no | yes_masked
#   disclosure: standard_note             # standard_note | client_format

# Only on a development machine: go on to step 3 with the throw-away certificate of compose:env.
# On a server, leave it out: a new env file stops the command after step 2, so OpenBao's
# certificate comes from the company CA first (runbook T11 §3c).
# throwaway_tls: true
