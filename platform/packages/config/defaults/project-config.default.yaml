# Default project configuration (design/D-08 A05, ADR-M18).
# Source of truth: handbook codes table, handbook/00-introduction/05-codes.md (v1.3).
# A project's own YAML is a partial override: mappings merge into this file, lists and values replace.
# The platform refuses overrides that loosen mandatory rules (see platform/packages/config/README.md).
# A codes-table change must be made together with the matching change here, in the same PR
# (platform/tests/config/codes-table-drift.test.ts checks it).
schema_version: 1

oversight:
  # Codes table §4 (gate × risk tier).
  # mode: HITL | HOTL | AUDIT, or POLICY (automatic policy check, G4 only; design/QUESTIONS.md #6).
  # roles: approvers (HITL) or the people notified / sampling (HOTL, AUDIT).
  # approvals: approvals from different people (default 1).
  matrix:
    G1: # §4 row G1: HITL at every tier; Person A
      low: { mode: HITL, roles: [person_a] }
      medium: { mode: HITL, roles: [person_a] }
      high: { mode: HITL, roles: [person_a] }
      critical: { mode: HITL, roles: [person_a] }
    G2: # §4 row G2: HOTL / HITL / HITL / HITL; "Person A; Person B for High+"
      low: { mode: HOTL, roles: [person_a] }
      medium: { mode: HITL, roles: [person_a] }
      high: { mode: HITL, roles: [person_b] }
      critical: { mode: HITL, roles: [person_b] }
    G3: # §4 row G3: HOTL / HITL / HITL / HITL; Person B
      low: { mode: HOTL, roles: [person_b] }
      medium: { mode: HITL, roles: [person_b] }
      high: { mode: HITL, roles: [person_b] }
      critical: { mode: HITL, roles: [person_b] }
    G4: # §4 row G4: Policy check / Policy check / HITL / HITL; D-02 §6.2 "Person A for High"
      low: { mode: POLICY }
      medium: { mode: POLICY }
      high: { mode: HITL, roles: [person_a] }
      critical: { mode: HITL, roles: [person_a] } # design/QUESTIONS.md #5
    G5: # §4 row G5: HOTL / HOTL / HOTL → HITL on breach / HITL; Person A
      low: { mode: HOTL, roles: [person_a] }
      medium: { mode: HOTL, roles: [person_a] }
      high: { mode: HOTL, on_breach: HITL, roles: [person_a] }
      critical: { mode: HITL, roles: [person_a] } # design/QUESTIONS.md #5
    G6: # §4 row G6: Automated + AUDIT / HOTL / HITL / HITL; D-02 §6.2 "Person B for High+"
      low: { mode: AUDIT, roles: [person_b] } # design/QUESTIONS.md #10
      medium: { mode: HOTL, roles: [person_b] } # design/QUESTIONS.md #10
      high: { mode: HITL, roles: [person_b] }
      critical: { mode: HITL, roles: [person_b] }
    G7: # §4 row G7: HITL at every tier; Critical "+ second approver"; Person B
      low: { mode: HITL, roles: [person_b] }
      medium: { mode: HITL, roles: [person_b] }
      high: { mode: HITL, roles: [person_b] }
      critical: { mode: HITL, roles: [person_b, second_approver], approvals: 2 }
    G8: # §4 row G8; Critical "+ business/security approval" = second approver (D-02 §3)
      production:
        low: { mode: HITL, roles: [person_b] }
        medium: { mode: HITL, roles: [person_b] }
        high: { mode: HITL, roles: [person_b] }
        critical: { mode: HITL, roles: [person_b, second_approver], approvals: 2 }
      non_production: # §4 Low "non-production: HOTL"; Medium and High from Ch.15 §15.8 (QUESTIONS.md #7)
        low: { mode: HOTL, roles: [person_b] }
        medium: { mode: HOTL, roles: [person_b] }
        high: { mode: HOTL, roles: [person_b] }
        critical: { mode: HITL, roles: [person_b, second_approver], approvals: 2 }

  # §4 "G3 is always HITL … when the change involves"; D-02 FR-15. Projects may add flags, never remove.
  forced_hitl_g3:
    change_flags:
      - migration
      - breaking_contract
      - new_service_boundary
      - security_boundary
      - system_of_record
      - prod_infrastructure
      - core_business_rule

  # §4 "G7 needs two approvers … for"; D-02 FR-16. Projects may add flags, never remove.
  dual_approval_g7:
    change_flags:
      - migration
      - payment
      - personal_data
      - prod_infrastructure
      - breaking_contract
      - safety_function
    roles: [person_b, second_approver]

  # §4 row G6 "security findings go to HITL at any tier"; Ch.14 §14.8.
  # Findings at or above min_severity make G6 HITL; lower ones are recorded as evidence only, so
  # low / info findings do not make every PR wait for a person (Ch.19). A critical finding always
  # makes G6 HITL (rule M6). design/QUESTIONS.md #19.
  g6_security_findings:
    mode: HITL
    min_severity: high

  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). D-02 FR-12; QUESTIONS.md #9.
  hitl_gate_deadline: { value: 1, unit: working_days }
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). D-03 §6; QUESTIONS.md #9.
  hotl_block_window: { value: 4, unit: working_hours }
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). D-02 FR-17; QUESTIONS.md #9.
  approval_expiry: { value: 7, unit: days }
  # [Proposal] pilot default (QUESTIONS.md #90). The escalation raised once when a gate waits for a
  # person longer than hitl_gate_deadline (D-02 FR-12, FR-18). Severity sets its SLA clocks
  # (escalation.sla); notify does not freeze the intent until its acknowledgement is missed.
  gate_overdue: { severity: medium, response_level: notify }

autonomy:
  # Codes table §3 "Maximum autonomy"; D-02 FR-03. The MVP never allows above L2 (D-02 §4.2).
  max_by_risk: { low: L2, medium: L2, high: L1, critical: L0 }

escalation:
  # Acknowledge: codes table §6.3. Resolve: handbook Ch.6 §6.4.
  sla:
    critical:
      acknowledge: { value: 15, unit: minutes }
      resolve: { value: 1, unit: hours }
    high:
      acknowledge: { value: 1, unit: hours }
      resolve: { kind: end_of_working_day }
    medium:
      acknowledge: { value: 1, unit: working_days }
      resolve: { value: 3, unit: working_days }
    low:
      acknowledge: { value: 3, unit: working_days }
      resolve: { kind: next_planned_work }
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). QUESTIONS.md #9.
  # Working-day and working-hour clocks skip non-working days and `holidays` (local dates, e.g. Tết).
  calendar:
    time_zone: Asia/Ho_Chi_Minh
    working_days: [mon, tue, wed, thu, fri]
    working_hours: { start: '09:00', end: '18:00' }
    holidays: []
  # Who receives an escalation first, per route (handbook Ch.6 §6.4 "Who receives it";
  # QUESTIONS.md #74). The raiser picks the route. A missed acknowledgement moves it to the backup,
  # then to governance, which is always the last step (M17). `backup_role: null` = no backup step.
  # Producers of the change are never chosen (FR-18).
  routing:
    intent: { owner_role: person_a, backup_role: person_b }
    technical: { owner_role: person_b, backup_role: second_approver }
    security: { owner_role: person_b, backup_role: second_approver }
    policy: { owner_role: governance, backup_role: null }
  # Roles told when an escalation is raised (handbook Ch.6 §6.4 SLA table "Notify"; codes table
  # §6.3: Critical goes to leadership). The owner of the first step is always told as well. M17:
  # each list contains at least the handbook's roles.
  notify_on_raise:
    critical: [governance, person_a, person_b]
    high: [governance, person_a, person_b]
    medium: [person_a, person_b]
    low: [person_a]
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). QUESTIONS.md #75.
  # Remind the step's holder when this share of the acknowledge window has passed. Each step
  # (owner, backup, governance) gets a fresh acknowledge window from the SLA table.
  reminder_percent: 75
  # Actions that continue while an escalation freezes the intent (handbook Ch.6 §6.5;
  # QUESTIONS.md #76). Only these four codes exist; a project can remove some, never add others.
  safe_actions: [read_only, sandbox_test, unpublished_draft, collect_metrics]

run:
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). D-02 FR-13; QUESTIONS.md #9.
  g6_ci_retries: 2
  loop_detection:
    # D-02 FR-35; handbook Ch.3 §3.6 "more than 3 repeated identical tool calls → stop".
    identical_tool_calls_max: 3
    # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). FR-35; QUESTIONS.md #9.
    # No new agent event of any kind for this many minutes → the run stops (ADR-M42 §2.7). At most
    # 30 (rule M27); under 5 gives a warning (a long silent command may stop a healthy run).
    no_progress_window_minutes: 15
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). D-03 §8; QUESTIONS.md #33.
  # Run Contract validity from issue to sandbox start only; the run itself is capped by its
  # max_duration_min. Above 60 minutes gives a warning.
  contract_validity_minutes: 15
  # D-03 §8; ADR-M22. Tolerated clock difference between worker and runner for the "not yet
  # valid" check only. Expiry has no tolerance.
  contract_clock_skew_seconds: 0
  # D-02 FR-32; handbook template T13 (`max_iterations: 30`, `max_minutes: 60`); QUESTIONS.md #13
  # (values chosen by Harry in the C05 plan, 2026-09-27). Caps of a run when
  # the task sets none: the agent stops itself at the iteration cap; the runner interrupts the agent
  # at the time cap, then removes the sandbox. A higher value gives a warning.
  default_max_iterations: 30
  default_max_duration_minutes: 60
  # Task C06, QUESTIONS.md #108 (Harry, 2026-09-27): the registered agent (its agent_key, see
  # `adlc admin agent`) that runs this project's intents. One agent per project in the MVP; B09
  # may pick the agent per plan task later. None by default: G4 fails until the project sets one.
  agent_key: null
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). Task C06 session 2,
  # ADR-M33 §2.6 (QUESTIONS.md #53): a Run Contract that expires while its run waits for a runner
  # is cancelled and issued again, at most this many times for one G4 decision; then escalated.
  contract_attempts_max: 3
  # Task C06 session 2 (Harry, 2026-09-27; D-03 §6 "Stopped → Escalated: always reviewed"): a run
  # that fails or is lost raises a technical escalation. [Proposal] pilot severity; mandatory rule
  # M20: the response level is pause or higher, so the intent stays frozen until a person decides.
  failed_run_escalation: { severity: high, response_level: pause }
  # Task C07 (ADR-M34 §2.8; QUESTIONS.md #21, #132): a G5 breach (agent instruction files changed,
  # the cost cap, the iteration or time cap, a stalled run) pauses the intent and raises an
  # escalation (route security or intent, by cause). [Proposal] pilot severity; mandatory rule M22:
  # the response level is pause or higher, so the intent stays frozen until a person decides.
  g5_breach_escalation: { severity: high, response_level: pause }
  # Task C11 (ADR-M42; QUESTIONS.md #181; D-03 §6.5 "opens an escalation for review"; handbook
  # Ch.6 §6.7 step 2 Contain): a kill raises a technical escalation at once. [Proposal] pilot
  # severity; mandatory rule M26: the response level is pause or higher, so the intent stays frozen
  # until a person decides.
  kill_escalation: { severity: high, response_level: contain }
  # X11 (ADR-M29 §2.10, QUESTIONS #551–#554). Context condensing of OpenHands work runs: `off`, or
  # `summarize` (old events in the model's view are replaced by a summary that the run's own model
  # writes, with the run's key and budget). Default off until Harry chooses from the measured numbers
  # (ADR-M29 §2.10, QUESTIONS #553). `summarize` needs the context size of the run's model in
  # `model_context_tokens` (rule M35); a run whose model has none runs without condensing.
  # [Proposal] max_events and keep_first: OpenHands' values for small models.
  context_condensing:
    mode: off
    max_events: 120
    keep_first: 2
    model_context_tokens: {}
  # H05 (ADR-M95, QUESTIONS #456, #601–#603; Harry, 2026-10-13): the largest change a person must
  # review. The runner counts the changed files and lines (added plus removed) of the run's diff;
  # lock files and files the base commit's `.gitattributes` marks `linguist-generated` are counted
  # apart and not against the limits. Over a limit (or with no count), G5 is HITL: Person A allows
  # the change with a reason code or sends it back to G3 to split the plan. Never a hard block.
  # [Proposal] review after the first trial reports.
  review_limits:
    max_changed_files: 40
    max_changed_lines: 1500

budget:
  # D-07 §6; D-02 FR-52; handbook Ch.3 §3.6: warning at 80 %, stop at 100 %.
  warn_percent: 80
  stop_percent: 100
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). D-02 §12; QUESTIONS.md #9.
  default_intent_usd: 10
  # [Proposal] pilot default, review after 2–4 weeks of data (handbook Ch.8). D-02 §12; QUESTIONS.md #9.
  default_run_usd: 2

model_routing:
  # D-07 §4. `api` for client_confidential only when the project AI record allows it (D-02 FR-19).
  allowed_provider_types:
    public: [api, self_hosted]
    internal: [api, self_hosted]
    client_confidential: [api, self_hosted]
    client_restricted: [self_hosted]
    prohibited: []

retention:
  # D-05 §10.1; D-02 FR-44. Days the evidence files of an intent are kept after it ended (task
  # E05, ADR-M51). Between 180 and 3650 (mandatory rule M31, QUESTIONS #236); held evidence is
  # kept longer (`adlc admin evidence hold`).
  evidence_retention_days: 180

github:
  # D-02 §6.3; ADR-M11.
  poll_interval_seconds: 30

verification:
  # C08 PR 2, design/QUESTIONS.md #159, ADR-M38 §2.7. The CI checks G6 waits for, by name: empty =
  # every check on the pushed commit. A project with a single summary check names it (the pilot
  # repository: [ci-ok]). A required check that is missing counts as pending.
  required_checks: []
  # Still pending this long after the push → paused at G6 with a technical escalation (no retry
  # used). Restarts when that escalation is closed.
  ci_timeout_minutes: 60
  # O06, ADR-M106. No check at all on the pushed commit (the repository may have no CI) this long
  # after the push → paused at G6 with a technical escalation that names the cause (`ci_missing`).
  # The shorter of this and ci_timeout_minutes applies.
  ci_missing_minutes: 15

access:
  # Task B03, ADR-M26, QUESTIONS.md #66. D-02 §3: Person A creates intents. Creators may always read.
  # The viewer role never creates intents (mandatory rule M16).
  intent_create_roles: [person_a]
  intent_read_roles: [person_a, person_b, second_approver, pm_brse, governance, admin, viewer]
  # Task B12, ADR-M32, QUESTIONS.md #103. The project AI record (handbook Ch.2 §2.5, T7): D-02 §3
  # says PM / BrSE maintains it, Ch.2 §2.5 says Person A owns it, T7 says both fill it in.
  # Writers may always read. The viewer role never writes it (mandatory rule M19).
  ai_record_write_roles: [person_a, pm_brse]
  ai_record_read_roles: [person_a, person_b, second_approver, pm_brse, governance, admin, viewer]
  # Task B08, ADR-M39, QUESTIONS #162. Who links an intent's spec (path in the repository, D-02
  # FR-02): Person A owns the intent, PM / BrSE writes the specs (D-09 §9). The viewer role never
  # links a spec (mandatory rule M23). Reading the linked specs follows `intent_read_roles`.
  spec_link_roles: [person_a, pm_brse]
  # Task B09, ADR-M40, QUESTIONS #168. Who submits an intent's plan (`.sdlc/plans/<INT>.yaml`,
  # template T13): Person A writes or accepts the plan (handbook Ch.12), Person B approves it at
  # G3. The submitter is a producer of the plan and never approves G3 (FR-11). The viewer role
  # never submits a plan (mandatory rule M24). Reading the plans follows `intent_read_roles`.
  plan_submit_roles: [person_a]
  # Task C11, ADR-M42, QUESTIONS #180. D-02 FR-34: Person A, Person B and governance may stop any
  # run with the kill switch (`adlc run kill`, `/kill`). Mandatory rule M25: these three always stay
  # in the list and the viewer role never kills. The producer of the run may kill it: killing is
  # containment, never an approval, and the escalation it raises is decided by someone else.
  kill_roles: [person_a, person_b, governance]
  # Task E04, ADR-M45, QUESTIONS #196. Who reads the cost report of this project or of one of its
  # intents (`adlc cost report`, D-02 FR-53): Person A operates runs and receives budget
  # escalations, Person B decides technical escalations, PM / BrSE talks to the client about cost,
  # governance and admin own budgets. Tenant admins always read it, also for the whole tenant.
  # Cost is commercial data (client billing later, D-07 §5): the viewer role never reads it
  # (mandatory rule M28).
  cost_read_roles: [person_a, person_b, pm_brse, governance, admin]
  # Task E06, ADR-M47, QUESTIONS #206. Who reads the gate waiting-time metrics of this project
  # (`adlc metrics gates`, D-02 FR-12): the people who decide at the gates and the people who
  # run the process. Tenant admins always read them, also for the whole tenant. Waiting times show
  # how fast the team answers: internal data, so the viewer role never reads them (mandatory rule
  # M29).
  metrics_read_roles: [person_a, person_b, second_approver, pm_brse, governance, admin]
  # Task E02, ADR-M48, QUESTIONS #218. Who builds (`adlc evidence build`) and who reads or exports
  # (`adlc evidence list|show|export`) the Evidence Pack of an intent of this project (D-02 FR-40,
  # FR-42). Tenant admins always may. A pack is client-facing evidence and names the approvers, so
  # the viewer role never builds or reads it (mandatory rule M30).
  evidence_build_roles: [person_a, person_b, pm_brse, governance, admin]
  evidence_read_roles: [person_a, person_b, second_approver, pm_brse, governance, admin]
  # Task E05, ADR-M51, QUESTIONS #235. Who puts an intent's evidence on hold, and releases the
  # hold (`adlc admin evidence hold|release`): held evidence is never purged (a dispute, an
  # incident, a client request). Tenant admins always may. Never the viewer (mandatory rule M32).
  evidence_hold_roles: [governance, admin]
  # Task L05, ADR-M82, QUESTIONS #470. Who creates, changes, archives and runs the project's
  # evaluation plans (the dashboard, `adlc eval`). Tenant admins always may. Plans spend money,
  # so the viewer role never does (mandatory rule M33); everybody who reads the project reads them.
  eval_roles: [person_a, person_b, governance, admin]
  # Task B13, ADR-M37, QUESTIONS #154. Separation of duties (handbook Ch.5, codes table §5): one
  # person never holds both roles of a pair on the same project. Person A (owner) and Person B
  # (independent reviewer) always stay apart (mandatory rule M21): G1–G3 have no producers
  # (QUESTIONS #64), so one person holding both could approve every gate of their own intent.
  # Person B and the second approver are the two people of a dual approval (FR-16).
  # [Proposal] pilot default for the second pair, review after 2–4 weeks of data (handbook Ch.8).
  conflicting_roles:
    - [person_a, person_b]
    - [person_b, second_approver]

agents:
  # Handbook Ch.20 §20.8 (decision: Harry, 2026-09-24): recertify every agent every 3 months. The
  # owner is warned when the last recertification is older; the run is not blocked (D-02 FR-36).
  # Mandatory rule M18: never more than 3. Task C10, ADR-M31.
  recertification_months: 3
  # Task L09, ADR-M86 §2.4, QUESTIONS #496–#499. An approval to activate an agent (and, from L10,
  # a recertification) names an evaluation of this project. It qualifies when it is the latest
  # finished evaluation of the agent version's fingerprint (model, instructions, tools), ran the
  # whole task set, scored at least `min_tasks` tasks, reached `min_resolve_rate`, had no scope
  # breach, is not worse than the last approved version for a change, and is not older than the
  # age limit. `mode`: `off` (no check), `warn` (accepted with a warning), `required` (refused).
  # Default `warn`: most projects have no own task set yet. Mandatory rule M34:
  # `recertification_max_age_days` never more than 90. [Proposal] numbers.
  evaluation:
    mode: warn
    min_tasks: 8
    min_resolve_rate: 0.5
    approval_max_age_days: 30
    recertification_max_age_days: 90

knowledge:
  # Task X04 PR 3a, ADR-M89 §2.3: the index of a project's Markdown documents for the tool
  # permission `read_documents`, built in the run preparation (5 minutes): a repository over a
  # limit fails the run (`tool_unavailable`), never a partial index. Later runs reuse their chunks.
  # [Proposal] numbers, to be measured by A10 (bge-m3 on CPU).
  max_files: 500
  max_file_bytes: 262144
  max_total_bytes: 8388608
  max_chunks: 2000
  chunk_chars: 2000
  embed_batch: 32

code_index:
  # Task X06, ADR-M108 §2.6: the index of a project's source files (TypeScript, JavaScript, Vue,
  # Python, Java, Go) for the tool permission `read_code`, built in the run preparation with
  # Tree-sitter. More files, bytes or symbols than these fail the run (`tool_unavailable`), never a
  # partial index; one file over `max_file_bytes` or `parse_timeout_ms` is left out and counted.
  # [Proposal] numbers, to be measured by A10.
  max_files: 5000
  max_file_bytes: 524288
  max_total_bytes: 67108864
  max_symbols: 500000
  parse_timeout_ms: 2000

memory:
  # Task X13, ADR-M74 §2.2, QUESTIONS #574 (Harry, 2026-10-24): agent memory across runs. Notes in
  # `.sdlc/memory/<name>.md` of the repository that a person who is not their producer approved
  # (`adlc memory approve`). `off`: runs never read memory. `read`: runs read the approved set.
  # `read_propose`: runs also propose changes in a separate pull request (needs L2, rule M36).
  # Files past `max_files` are not read; text is cut at `max_file_chars` per file and
  # `max_total_chars` in total (about 3,000 tokens). Evaluation runs never use memory.
  # [Proposal] default `off` until the owner measures it (QUESTIONS #714).
  mode: off
  max_files: 20
  max_file_chars: 4000
  max_total_chars: 12000

learning:
  # Task X08b, ADR-M109 §2.3, QUESTIONS #708 (Harry, 2026-11-13): a person records a lesson with
  # `/lesson <category> <target>` from the moment the intent enters G8 until this many days after
  # it closed (the observation window of template T14 §7). 1 to 90.
  lesson_window_days: 14

tools:
  # Task X04, ADR-M69 §2.2: register tools (`tool:<key>`) are recertified like agents. Mandatory
  # rule M18: never more than 3 months. An overdue tool gives a warning; it does not block a run.
  recertification_months: 3
  # ADR-M69 §2.7: the run's MCP gateway refuses the calls of a tool after this many in one run
  # (`tool_refused`, `max_calls`); the run goes on without the tool. [Proposal] number.
  max_calls_per_run: 100
  # ADR-M69 §2.4: limits of each tool container of a run. A10 measures the effect. [Proposal].
  container_limits:
    memory_mb: 512
    cpu_millis: 1000
    pids: 256
  # ADR-M87: the run's MCP gateway, agentgateway 1.7.0 (Apache-2.0), pinned by the digest of its
  # multi-platform index (R038). CI scans it with the sandbox images (CRITICAL blocks). Null: no
  # register tool runs (`tool_unavailable`).
  gateway:
    image: cr.agentgateway.dev/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
  # X04 PR 3b, ADR-M69 §2.4, QUESTIONS #541: a tool that calls a model (`model_ref`, for example
  # the embedding model of `read_documents`) gets its own virtual key per run, capped at this
  # amount and never above what the run's own budget leaves. Its spend counts for the run (R027).
  # [Proposal] number: embedding a query with bge-m3 on the server costs nothing per call.
  model_budget_usd: 0.5

sandbox:
  # QUESTIONS #59 (A), ADR-M25: one sandbox image per project, built on the pinned OpenHands
  # agent-server base plus the project toolchain, referenced by digest (a tag alone is refused).
  # Default: the pinned base itself (ADR-M10 §2.1), which has no project toolchain.
  image: ghcr.io/openhands/agent-server:1.48.0-python-slim@sha256:8fcfab2dedb4b41b6aef219b9fa9b1f2588033fad3d998ae6aa11fe8c4fcf8b7

dependencies:
  # Task H02, ADR-M96 §2.2: allowed SPDX licenses for packages added or changed by agents.
  # Packages with licenses outside this set or with ambiguous/missing licenses trigger HITL.
  allowed_licenses:
    - MIT
    - Apache-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - ISC
    - 0BSD
    - CC0-1.0
    - Unlicense
  # Packages explicitly forbidden across the project.
  blocked_packages: []

evaluation:
  # Task L07, ADR-M85 §2.4. A project's own evaluation tasks come from its merged intents.
  # `test_globs`: a file the pull request added or changed and that matches one of these is a
  # hidden test of the task. `commands`: what `adlc eval task draft` writes into a new task card;
  # `{file}` in `fail_to_pass` gives one command per hidden test file. Empty lists: the person
  # writes the commands into the card. The scoring container has no network, so tests that need a
  # browser or a database fail the task's check.
  tasks:
    test_globs:
      - '**/*.test.*'
      - '**/*.spec.*'
      - 'test/**'
    commands:
      fail_to_pass: []
      pass_to_pass: []
      ci: []
  # Task L06, ADR-M83 §2.3, QUESTIONS #481. Thresholds of the recommendation rules of an
  # evaluation report. A comparing rule fires only with at least `min_paired_tasks` paired tasks,
  # and a difference is called only when McNemar's p < `alpha` and the intervals do not overlap.
  # [Proposal] defaults; review after the first evaluations on the server.
  recommendations:
    alpha: 0.05
    min_paired_tasks: 8
    low_ci_first_try_rate: 0.5
    unstable_gap: 0.3
    stopped_at_cap_share: 0.2
