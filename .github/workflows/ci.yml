# CI for the platform repo (design/D-08 task A09).
#
# GitHub Free: a private repository cannot make a check "required". A red check blocks the
# merge by process only (PR template, Person B). After the GitHub Team upgrade, make the
# `ci-ok` job the single required check (platform/GETTING-STARTED.md).
#
# Actions minutes (GitHub Free: 2,000 per month for the whole organization). GitHub bills every
# job rounded up to a whole minute, so short checks share one job (`scan`). A push to main runs
# nothing: the pull request already ran every check. The daily run only scans (new CVEs); the
# weekly run runs every job on main. The repository moved to the personal account hoanghainh1188
# on 2026-10-06 (its own 2,000 minutes per month).
name: ci

on:
  # Every branch, no path filter. ready_for_review: a draft skips the heavy jobs until then.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Keep these two strings equal to DAILY_CRON and WEEKLY_CRON below.
    - cron: '0 18 * * 1-6' # daily, 03:00 JST: the scan job only (new CVEs)
    - cron: '0 18 * * 0' # weekly, Monday 03:00 JST: every job, including the heavy ones
  workflow_dispatch: # every job

# Every job only reads the repository. Do not widen this without review.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Blocking thresholds (D-08 A09 AC3). Change them here only.
  # Accepted exceptions go in .gitleaks.toml, .trivyignore or .semgrepignore, with a reason.
  TRIVY_BLOCK_SEVERITY: CRITICAL
  TRIVY_REPORT_SEVERITY: HIGH # listed in the job summary, does not block
  SEMGREP_BLOCK_SEVERITY: ERROR
  SEMGREP_RULESETS: p/default p/github-actions
  # Pinned tools: version and SHA-256 of the linux x64 release archive.
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
  TRIVY_VERSION: 0.74.0
  TRIVY_SHA256: 2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
  # age for the backup tests (A10, O02): the release binary, never apt (the Ubuntu mirror can be
  # unreachable from GitHub's runners). The SHA-256 is the release asset's digest on GitHub.
  AGE_VERSION: 1.3.2
  AGE_SHA256: cbe24006683f8eb669266162894b9a522a1af52f2665fbc63a4bb032ed26ac10
  # O01 (design/ADR-M91 §2.4): the static Docker Engine and its rootless extras for the job
  # runner-rootless (a second, rootless Engine next to the runner machine's own one).
  DOCKER_ROOTLESS_VERSION: 29.8.2
  DOCKER_STATIC_SHA256: 995d1ef289677f74fd58d8d2c35727b6a4ee389c69db8638a3e42d0487aa5b0f
  DOCKER_ROOTLESS_EXTRAS_SHA256: 707ebf6a5afd88104086e7b6749997b2366e816aeaf2c3ef2305b08fde9ee007
  # runner-rootless, test:runner-split: the link address between the two Engines (O01 PR 2).
  RUNNER_LINK_ADDR: 10.203.0.1
  SEMGREP_IMAGE: semgrep/semgrep:1.178.0@sha256:32e459968daabe7ab86968184a29109b9564aa00392401156f9788452b42786b
  # Infrastructure owned by task A02. The compose job runs only when this file exists.
  COMPOSE_FILE_PATH: platform/deploy/docker-compose.yml
  DAILY_CRON: '0 18 * * 1-6'
  WEEKLY_CRON: '0 18 * * 0'

jobs:
  # One job for the short checks (each one alone takes under a minute): what to run, then
  # Gitleaks, Trivy and Semgrep. Every scanner runs even when an earlier one fails.
  scan:
    name: detect changes, secrets, dependencies, code
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      run_checks: ${{ steps.decide.outputs.run_checks }}
      run_db: ${{ steps.decide.outputs.run_db }}
      run_pilot: ${{ steps.decide.outputs.run_pilot }}
      run_compose: ${{ steps.decide.outputs.run_compose }}
      run_sandbox_image: ${{ steps.decide.outputs.run_sandbox_image }}
      run_dashboard: ${{ steps.decide.outputs.run_dashboard }}
      run_fresh_deploy: ${{ steps.decide.outputs.run_fresh_deploy }}
      release_version: ${{ steps.decide.outputs.release_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the full history; the change detection needs the base
          persist-credentials: false
      - id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          DRAFT: ${{ github.event.pull_request.draft }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # all = every job runs (manual and weekly runs); daily = the daily run on main.
          all=false; daily=false
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            all=true
          elif [ "$EVENT_NAME" = schedule ] && [ "$SCHEDULE" = "$WEEKLY_CRON" ]; then
            all=true
          elif [ "$EVENT_NAME" = schedule ]; then
            daily=true
          fi

          # checks: every pull request, weekly and manual runs. The daily run only scans: the pull
          # requests already ran the checks on that code, and the weekly run checks main again.
          checks=true; reason="every pull request, weekly and manual runs"
          if [ "$daily" = true ]; then
            checks=false; reason="daily run: the scan job only"
          fi
          echo "run_checks=$checks" >> "$GITHUB_OUTPUT"
          echo "checks job: run=$checks ($reason)" | tee -a "$GITHUB_STEP_SUMMARY"

          # db: like checks, except a pull request that changes documentation only (Markdown, the
          # design docs, the handbook, diagrams, the backlog CSV): no DB or workflow test reads them.
          db=$checks; dbwhy="$reason"
          if [ "$checks" = true ] && [ "$EVENT_NAME" = pull_request ] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null \
            && [ -z "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
              | grep -vE '\.(md|mmd|svg|csv)$|^(design|handbook|diagrams|_review)/' || true)" ]; then
            db=false; dbwhy="documentation only"
          fi
          echo "run_db=$db" >> "$GITHUB_OUTPUT"
          echo "db job: run=$db ($dbwhy)" | tee -a "$GITHUB_STEP_SUMMARY"

          # Heavy jobs: pull requests that change their paths (not while a draft), weekly and
          # manual runs. They also wait for the checks job to pass.
          # $1 = output name, $2 = label, $3 = reason when the paths changed, rest = paths.
          decide_heavy() {
            name=$1; label=$2; changed=$3; shift 3
            run=false
            if [ "$name" = run_compose ] && [ ! -f "$COMPOSE_FILE_PATH" ]; then
              why="$COMPOSE_FILE_PATH does not exist yet (task A02)"
            elif [ "$all" = true ]; then
              run=true; why="$EVENT_NAME run"
            elif [ "$daily" = true ]; then
              why="daily run: the heavy jobs run on the weekly schedule"
            elif [ "$DRAFT" = true ]; then
              why="draft pull request: runs when marked ready for review"
            elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
              run=true; why="base commit unknown, running to be safe"
            elif [ -n "$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "$@")" ]; then
              run=true; why="$changed changed"
            else
              why="$changed unchanged"
            fi
            echo "$name=$run" >> "$GITHUB_OUTPUT"
            echo "$label: run=$run ($why)" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          # Infrastructure (A02, A03), the OpenBao client (A04), the LiteLLM adapter and Cost
          # Controller (C03), the runner (C04), the intent workflow on Temporal (B07): their live
          # tests need Docker.
          decide_heavy run_compose "Compose integration job" \
            "platform/deploy/, the OpenBao client, the LiteLLM adapter, the Cost Controller, the runner, the intent workflow or a live test" \
            platform/deploy/ platform/packages/secrets/ platform/tests/integration/openbao/ platform/packages/adapters/model-litellm/ platform/packages/core/src/cost/ platform/tests/integration/litellm/ platform/apps/runner/ platform/tests/integration/runner/ platform/tests/integration/attack/ platform/apps/worker/src/workflows/ platform/apps/worker/src/temporal.ts platform/packages/workflow-client/ platform/tests/integration/workflow/compose-smoke.test.ts platform/tests/integration/deploy/seaweedfs-access.test.ts platform/tests/integration/deploy/access.test.ts platform/tests/integration/backup/

          # C04: the sandbox images, the runner and the package proxy (design/ADR-M25 §2.9).
          decide_heavy run_sandbox_image "Sandbox image job" \
            "a sandbox image, the runner, a tool image, the agent adapter, the package proxy or a live test" \
            platform/sandbox-images/ platform/apps/runner/ platform/apps/tool-project-docs/ platform/deploy/scripts/tool-image.sh platform/deploy/verdaccio/ platform/tests/integration/sandbox-image/ platform/packages/adapters/agent-openhands/ platform/packages/adapters/agent-opencode/ platform/packages/agent-kit/ platform/tests/integration/agent/ platform/tests/integration/attack/ platform/packages/config/defaults/

          # U01 (design/ADR-M54 §2.6): the dashboard's browser smoke test (Playwright, Chromium)
          # runs in the sandbox image job, without the sandbox steps when only these paths changed.
          decide_heavy run_dashboard "Dashboard smoke test (in the sandbox image job)" \
            "the dashboard, its response schemas, the catalog, the api's static route or the smoke test" \
            platform/apps/dashboard/ platform/packages/api-schemas/ platform/apps/api/src/dashboard/ platform/tests/e2e/ platform/packages/messages/src/locales/

          # C09: the pilot suite (G1–G8 with the real runner, about 7 minutes) runs on weekly and
          # manual runs only. After a pull request that changes the gate steps, the worker or the
          # pilot suite, run it by hand: gh workflow run ci --ref <branch>.
          echo "run_pilot=$all" >> "$GITHUB_OUTPUT"
          echo "Pilot suite (in the sandbox image job): run=$all (weekly and manual runs only)" | tee -a "$GITHUB_STEP_SUMMARY"

          # E07 (D-08 E07 AC3): the fresh deployment that follows platform/deploy/README.md. The
          # longest job: weekly and manual runs only, never on a pull request.
          echo "run_fresh_deploy=$all" >> "$GITHUB_OUTPUT"
          echo "Fresh deployment job: run=$all (weekly and manual runs only)" | tee -a "$GITHUB_STEP_SUMMARY"

          # V15 (ADR-M94 §2.5): a pull request that changes the root package.json version builds
          # and scans every release image, pushing nothing, so most failures appear before the tag.
          version=""; vwhy="the version is unchanged"
          if [ "$EVENT_NAME" != pull_request ]; then
            vwhy="not a pull request"
          elif [ "$DRAFT" = true ]; then
            vwhy="draft pull request: runs when marked ready for review"
          elif git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            head_version="$(jq -r .version package.json)"
            base_version="$(git show "$BASE_SHA:package.json" | jq -r .version)"
            if [ "$head_version" != "$base_version" ]; then
              version="$head_version"; vwhy="the version changes from $base_version to $head_version"
            fi
          fi
          echo "release_version=$version" >> "$GITHUB_OUTPUT"
          echo "Release image scan job: run=$([ -n "$version" ] && echo true || echo false) ($vwhy)" | tee -a "$GITHUB_STEP_SUMMARY"

      # Diagrams: every SVG carries the SHA-256 of its Mermaid source (scripts/diagrams.py). The
      # author renders with `pnpm diagrams:render` and commits the SVG; CI never commits.
      - name: Diagrams match their Mermaid sources
        if: ${{ !cancelled() }}
        run: python3 scripts/diagrams.py check

      # Gitleaks
      - name: Install gitleaks
        if: ${{ !cancelled() }}
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Gitleaks rule self-test (sdlc-api-token, task B03)
        if: ${{ !cancelled() }}
        run: |
          # A leaked platform token must be found; the fake fixture must stay allow-listed.
          dir="$RUNNER_TEMP/gitleaks-selftest"
          mkdir -p "$dir"
          printf 'sdlc_pat_%s\n' "$(head -c 32 /dev/urandom | basenc --base64url | tr -d '=\n')" > "$dir/leak.txt"
          if "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner --exit-code 1 "$dir"; then
            echo "the sdlc-api-token rule did not find a platform token" >&2
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner --exit-code 1 platform/tests/gitleaks
      - name: Gitleaks scan (any finding blocks)
        if: ${{ !cancelled() }}
        run: |
          status=0
          # --log-opts HEAD: the full history of the checked-out commit only. The default (--all)
          # would also scan other branches fetched by fetch-depth 0, such as open PRs of other tasks.
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --log-opts HEAD --redact --verbose --exit-code 1 \
            --report-format json --report-path "$RUNNER_TEMP/gitleaks.json" . || status=$?
          count=$(jq length "$RUNNER_TEMP/gitleaks.json" 2>/dev/null || echo "unknown")
          echo "### gitleaks: $count finding(s) (values redacted)" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      # Trivy (before Semgrep, which writes semgrep.json into the working tree)
      - name: Install trivy
        if: ${{ !cancelled() }}
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
      - name: Trivy report (does not block)
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln,misconfig --include-dev-deps \
            --severity "$TRIVY_REPORT_SEVERITY,$TRIVY_BLOCK_SEVERITY" --ignorefile .trivyignore \
            --disable-telemetry --skip-version-check --exit-code 0 \
            --format table --output "$RUNNER_TEMP/trivy.txt" .
          {
            echo "### trivy: $TRIVY_REPORT_SEVERITY and $TRIVY_BLOCK_SEVERITY findings (only $TRIVY_BLOCK_SEVERITY blocks)"
            echo '```text'
            cat "$RUNNER_TEMP/trivy.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Trivy scan (severity CRITICAL blocks)
        if: ${{ !cancelled() }}
        run: |
          "$RUNNER_TEMP/trivy" fs --scanners vuln,misconfig --include-dev-deps \
            --severity "$TRIVY_BLOCK_SEVERITY" --ignorefile .trivyignore \
            --disable-telemetry --skip-version-check --exit-code 1 .

      # Semgrep
      - name: Semgrep scan (severity ERROR blocks)
        if: ${{ !cancelled() }}
        run: |
          configs=""
          for ruleset in $SEMGREP_RULESETS; do configs="$configs --config $ruleset"; done
          status=0
          # shellcheck disable=SC2086 # $configs is a list of flags
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan $configs --severity "$SEMGREP_BLOCK_SEVERITY" --error \
            --metrics off --disable-version-check --json-output semgrep.json || status=$?
          count=$(jq '.results | length' semgrep.json 2>/dev/null || echo "unknown")
          echo "### semgrep: $count finding(s) at severity $SEMGREP_BLOCK_SEVERITY" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

  checks:
    name: build, lint, test
    needs: scan
    # Runs even when a scanner failed. != 'false': runs when scan could not decide.
    if: ${{ !cancelled() && needs.scan.outputs.run_checks != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # H04 (ADR-M93): the pinned Gitleaks of the runner's secret scan, on PATH (the in-process
      # runners of the tests find it there) and named for the scanner tests; a missing scanner
      # holds every run at G5.
      - run: |
          gitleaks="$(sh platform/deploy/scripts/gitleaks.sh)"
          dirname "$gitleaks" >> "$GITHUB_PATH"
          echo "SDLC_RUNNER_GITLEAKS_PATH=$gitleaks" >> "$GITHUB_ENV"
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      # V05: the npm package of the CLI packs, installs into an empty folder and runs.
      - run: pnpm cli:pack-check
      - name: Lint workflows (actionlint)
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  compose:
    name: integration (compose core)
    # Starts only after scan and checks passed: no heavy run on a change that fails the checks.
    needs: [scan, checks]
    # Shows as "skipped" (not passed) when scan says no.
    if: needs.scan.outputs.run_compose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # H04 (ADR-M93): the pinned Gitleaks of the runner's secret scan, on PATH (the in-process
      # runners of the tests find it there) and named for the scanner tests; a missing scanner
      # holds every run at G5.
      - run: |
          gitleaks="$(sh platform/deploy/scripts/gitleaks.sh)"
          dirname "$gitleaks" >> "$GITHUB_PATH"
          echo "SDLC_RUNNER_GITLEAKS_PATH=$gitleaks" >> "$GITHUB_ENV"
      - name: Create a random .env (A02 script, no GitHub secrets)
        run: |
          for script in platform/deploy/scripts/init-env.sh platform/deploy/scripts/up.sh; do
            [ -f "$script" ] || { echo "::error::$script is missing; the compose job needs it (task A02)"; exit 1; }
          done
          sh platform/deploy/scripts/init-env.sh
      - name: Start the core profile and wait until healthy
        env:
          SDLC_WAIT_TIMEOUT: '600' # cold image pulls on GitHub runners (A02 default: 300)
        run: sh platform/deploy/scripts/up.sh core
      - run: pnpm test:integration
      # A03, A04: OpenBao bootstrap and the OpenBao client, each on its own throw-away Compose
      # project (throw-away test keys, never printed). Separate from the core stack above.
      - run: pnpm test:openbao
      # A12: SeaweedFS's filer, volume server and master unreachable from another container, the S3
      # gRPC port refuses unauthenticated IAM calls, start.sh fails closed; own throw-away project.
      - run: pnpm test:seaweedfs
      # C03: LiteLLM with keys from OpenBao (profile "models") and the Cost Controller, on its own
      # throw-away Compose project with a stub model (throw-away test keys, never printed).
      - run: pnpm test:litellm
      # C04: sandbox egress and hardening on the runner's Docker Engine (per-run internal networks,
      # fixture image in a throw-away registry:2, stub services; everything removed afterwards).
      - run: pnpm test:runner
      # C04 session 3: the sdlc-runner container in the profile "sandbox" (socket proxy, Verdaccio,
      # runner-credentials, clean-up at start), on its own throw-away Compose project.
      - run: pnpm test:runner-compose
      # B03: the sdlc-api image, its database password from OpenBao (api-credentials) and a token
      # from `adlc admin bootstrap`, on its own throw-away Compose project (throw-away test keys).
      - run: pnpm test:api
      # V09: team access through the TLS proxy (profile access): from another network only the
      # proxy answers, TLS, routes, limits, headers; own throw-away project and throw-away CA.
      - run: pnpm test:access
      # B07 session 2: the intent workflow on the real Temporal (sticky queues), workers stopped
      # and started; own throw-away Compose project and a throw-away platform PostgreSQL.
      - run: pnpm test:workflow-compose
      # A10 PR 2: the backup and the restore drill (age, throw-away keys), own throw-away project.
      - name: Install age (backups, A10)
        run: |
          archive="age-v${AGE_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" --proto '=https' --retry 3 \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/$archive"
          echo "$AGE_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" age/age age/age-keygen
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
      - run: pnpm test:backup
      - name: Show service state and logs
        if: failure()
        run: |
          docker compose -f "$COMPOSE_FILE_PATH" --env-file platform/deploy/.env --profile core ps --all
          docker compose -f "$COMPOSE_FILE_PATH" --env-file platform/deploy/.env --profile core logs --no-color --tail 200
      - name: Stop and remove everything
        if: always()
        run: |
          [ -f platform/deploy/.env ] || exit 0
          docker compose -f "$COMPOSE_FILE_PATH" --env-file platform/deploy/.env --profile core down --volumes --remove-orphans

  runner-rootless:
    # O01 (design/ADR-M91 §2.4, D-08 O01 AC2): the runner's live tests on a rootless Docker Engine,
    # the Engine the runner gets on the server. Same tests as the compose job's `pnpm test:runner`;
    # the fixture sandbox also checks that the kernel applies the limits (cgroup delegation).
    # Then `pnpm test:runner-split` (O01 AC1): the runner host's project on that Engine.
    name: runner on rootless Docker
    needs: [scan, checks]
    if: needs.scan.outputs.run_compose == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # H04 (ADR-M93): the pinned Gitleaks of the runner's secret scan, on PATH (the in-process
      # runners of the tests find it there) and named for the scanner tests; a missing scanner
      # holds every run at G5.
      - run: |
          gitleaks="$(sh platform/deploy/scripts/gitleaks.sh)"
          dirname "$gitleaks" >> "$GITHUB_PATH"
          echo "SDLC_RUNNER_GITLEAKS_PATH=$gitleaks" >> "$GITHUB_ENV"
      - name: Install the rootless Docker Engine (static archives, pinned by SHA-256)
        run: |
          sudo apt-get install -y --no-install-recommends uidmap slirp4netns dbus-user-session
          base="https://download.docker.com/linux/static/stable/x86_64"
          curl -fsSLo "$RUNNER_TEMP/docker.tgz" "$base/docker-${DOCKER_ROOTLESS_VERSION}.tgz"
          echo "$DOCKER_STATIC_SHA256  $RUNNER_TEMP/docker.tgz" | sha256sum -c -
          curl -fsSLo "$RUNNER_TEMP/extras.tgz" "$base/docker-rootless-extras-${DOCKER_ROOTLESS_VERSION}.tgz"
          echo "$DOCKER_ROOTLESS_EXTRAS_SHA256  $RUNNER_TEMP/extras.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/rootless"
          tar -xzf "$RUNNER_TEMP/docker.tgz" -C "$RUNNER_TEMP/rootless" --strip-components=1
          tar -xzf "$RUNNER_TEMP/extras.tgz" -C "$RUNNER_TEMP/rootless" --strip-components=1
      - name: Start the rootless Engine (sets DOCKER_HOST for the next steps)
        run: sh platform/deploy/scripts/test-rootless-docker.sh "$RUNNER_TEMP/rootless"
      - run: pnpm test:runner
      # O01 PR 2 (ADR-M91 §2.3, §2.7): the split set-up on one machine, as on a server without a
      # second VM. The link address is a dummy interface that only the two Engines use; the
      # platform runs on the machine's own Engine, the runner host's project on the rootless one.
      - name: The link address (a dummy interface)
        run: |
          sudo ip link add sdlc-link type dummy
          sudo ip addr add "$RUNNER_LINK_ADDR/32" dev sdlc-link
          sudo ip link set sdlc-link up
      - run: pnpm test:runner-split
        env:
          SDLC_RUNNER_SPLIT_LINK_ADDR: ${{ env.RUNNER_LINK_ADDR }}
          SDLC_RUNNER_SPLIT_DOCKER_HOST: ${{ env.DOCKER_HOST }}
          SDLC_RUNNER_SPLIT_PLATFORM_HOST: unix:///var/run/docker.sock
      - name: Show the rootless Engine's log
        if: failure()
        run: XDG_RUNTIME_DIR="/run/user/$(id -u)" journalctl --user -u docker.service --no-pager -n 300 || true

  sandbox-image:
    # C04 (design/ADR-M25 §2.9, QUESTIONS #54): build the sandbox image node24, scan it with Trivy
    # (vulnerabilities and licences, ADR-M10 §2.1) and run it hardened with the real package
    # proxy. X03 (ADR-M88 §2.5): the same for node24-opencode, built FROM node24, plus the licence
    # check of OpenCode's dependency tree (QUESTIONS #524) and the agent tests with OpenCode. Nothing is pushed anywhere except a throw-away registry:2 on 127.0.0.1 inside the job:
    # no GHCR, no GitHub secrets, no keys. U01: also the dashboard's browser smoke test; a pull
    # request that changes only the dashboard runs that step alone (Actions minutes).
    name: sandbox image (node24)
    needs: [scan, checks]
    if: needs.scan.outputs.run_sandbox_image == 'true' || needs.scan.outputs.run_dashboard == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # H04 (ADR-M93): the pinned Gitleaks of the runner's secret scan, on PATH (the in-process
      # runners of the tests find it there) and named for the scanner tests; a missing scanner
      # holds every run at G5.
      - run: |
          gitleaks="$(sh platform/deploy/scripts/gitleaks.sh)"
          dirname "$gitleaks" >> "$GITHUB_PATH"
          echo "SDLC_RUNNER_GITLEAKS_PATH=$gitleaks" >> "$GITHUB_ENV"
      - name: Build (no push)
        if: needs.scan.outputs.run_sandbox_image == 'true'
        run: |
          ref="$(sh platform/sandbox-images/build.sh node24 --no-push)"
          docker save "$ref" -o "$RUNNER_TEMP/node24.tar"
          echo "Built $ref" >> "$GITHUB_STEP_SUMMARY"
          oc="$(NODE24="$ref" sh platform/sandbox-images/build.sh node24-opencode --no-push)"
          docker save "$oc" -o "$RUNNER_TEMP/node24-opencode.tar"
          echo "Built $oc" >> "$GITHUB_STEP_SUMMARY"
          # X04 (ADR-M87, R038): the run's MCP gateway, pinned by digest in the default configuration.
          gw="$(sed -n '/^  gateway:/,/^[^ ]/s/^    image: //p' platform/packages/config/defaults/project-config.default.yaml)"
          docker pull "$gw"
          docker save "$gw" -o "$RUNNER_TEMP/gateway.tar"
          echo "Pulled $gw" >> "$GITHUB_STEP_SUMMARY"
          # X04 PR 3b (ADR-M89): the first register tool, read_documents.
          tool="$(sh platform/deploy/scripts/tool-image.sh project-docs --no-push)"
          docker save "$tool" -o "$RUNNER_TEMP/tool-project-docs.tar"
          echo "Built $tool" >> "$GITHUB_STEP_SUMMARY"
      - name: Install trivy
        if: needs.scan.outputs.run_sandbox_image == 'true'
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
      - name: Report (does not block)
        if: needs.scan.outputs.run_sandbox_image == 'true'
        run: |
          for image in node24 node24-opencode gateway tool-project-docs; do
            # X04 PR 3b: the tool image has the Node base of sdlc-api, so the repo's ignore file
            # (as in release-images.yml); the sandbox images and the gateway keep theirs.
            ignore=platform/sandbox-images/.trivyignore
            [ "$image" = tool-project-docs ] && ignore=.trivyignore
            "$RUNNER_TEMP/trivy" image --input "$RUNNER_TEMP/$image.tar" --scanners vuln \
              --severity "$TRIVY_REPORT_SEVERITY,$TRIVY_BLOCK_SEVERITY" \
              --ignorefile "$ignore" \
              --disable-telemetry --skip-version-check --exit-code 0 \
              --format table --output "$RUNNER_TEMP/trivy-image.txt"
            {
              echo "### trivy image $image: $TRIVY_REPORT_SEVERITY and $TRIVY_BLOCK_SEVERITY findings (only $TRIVY_BLOCK_SEVERITY blocks)"
              echo '```text'
              cat "$RUNNER_TEMP/trivy-image.txt"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Scan vulnerabilities (severity CRITICAL blocks)
        if: needs.scan.outputs.run_sandbox_image == 'true'
        run: |
          for image in node24 node24-opencode gateway tool-project-docs; do
            # X04 PR 3b: the tool image has the Node base of sdlc-api, so the repo's ignore file
            # (as in release-images.yml); the sandbox images and the gateway keep theirs.
            ignore=platform/sandbox-images/.trivyignore
            [ "$image" = tool-project-docs ] && ignore=.trivyignore
            "$RUNNER_TEMP/trivy" image --input "$RUNNER_TEMP/$image.tar" --scanners vuln \
              --severity "$TRIVY_BLOCK_SEVERITY" --ignorefile "$ignore" \
              --disable-telemetry --skip-version-check --exit-code 1
          done
      # ADR-M10 §2.1: the CRITICAL licence category (AGPL, SSPL, commercial) blocks.
      - name: Scan licences (CRITICAL category blocks)
        if: needs.scan.outputs.run_sandbox_image == 'true'
        run: |
          for image in node24 node24-opencode gateway tool-project-docs; do
            "$RUNNER_TEMP/trivy" image --input "$RUNNER_TEMP/$image.tar" --scanners license \
              --severity "$TRIVY_BLOCK_SEVERITY" \
              --disable-telemetry --skip-version-check --exit-code 1
          done
      # X03 (QUESTIONS #524): the OpenCode binary is opaque to Trivy, so the licences of its
      # dependency tree are checked at the Git tag of the pinned version (GitHub, npm registry).
      - name: Licences of OpenCode's dependency tree
        if: needs.scan.outputs.run_sandbox_image == 'true'
        run: node platform/sandbox-images/node24-opencode/licences.mjs
      # Hardened sandbox from the image by digest (throw-away registry:2), with Verdaccio: Node 24,
      # pnpm through corepack and the proxy, no other way out.
      - if: needs.scan.outputs.run_sandbox_image == 'true'
        run: pnpm test:sandbox-image
      # C05 (design/ADR-M29): the runner drives the real OpenHands Agent Server in a node24 sandbox
      # with a scripted stub model (no provider, no key) and a throw-away PostgreSQL.
      - if: needs.scan.outputs.run_sandbox_image == 'true'
        run: pnpm test:agent
      # X03 (ADR-M88): the same agent tests with the OpenCode adapter in node24-opencode.
      - if: needs.scan.outputs.run_sandbox_image == 'true'
        run: pnpm test:agent
        env:
          SDLC_AGENT_ADAPTER: opencode
      # H01 (design/ADR-M80): attacks from inside the sandbox with a stub model that obeys every
      # injection: the sandbox's environment, network, Docker, other runs, packages and instruction
      # files; every test also searches the records and logs for canary secrets.
      - if: needs.scan.outputs.run_sandbox_image == 'true'
        run: pnpm test:attack
      # C09 (D-08 C09 AC1–AC5): G1–G6 on the sample repository's shape with the real runner, the
      # node24 sandbox and the Agent Server (stub model), the intent workflow on the Temporal test
      # server, a local Git host that protects main, and a throw-away PostgreSQL. One file at a time.
      # Weekly and manual runs only (Actions minutes).
      - if: needs.scan.outputs.run_pilot == 'true' && needs.scan.outputs.run_sandbox_image == 'true'
        run: pnpm test:pilot
      # U01 (design/ADR-M54 §2.6): the read-only dashboard in Chromium against a stub API that
      # serves the build through the api's own static route; screenshots at 375, 768, 1440 px.
      - name: Install Chromium for Playwright
        if: needs.scan.outputs.run_dashboard == 'true'
        run: |
          pnpm exec playwright install chromium
          # The runner image already has Chromium's libraries, so apt (whose Ubuntu mirror can be
          # unreachable from GitHub's runners) runs only when a library is missing, with retries.
          missing="$(find "$HOME/.cache/ms-playwright" -type f -perm -u+x \
            \( -name chrome -o -name headless_shell -o -name chrome-headless-shell \) \
            -exec ldd {} + | grep 'not found' | sort -u || true)"
          if [ -n "$missing" ]; then
            echo "$missing"
            printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\n' |
              sudo tee /etc/apt/apt.conf.d/80-sdlc-retries > /dev/null
            pnpm exec playwright install-deps chromium
          fi
      - if: needs.scan.outputs.run_dashboard == 'true'
        run: pnpm test:dashboard
      # The screenshots (375, 768, 1440 px, light and dark) for the pull request's reviewer.
      - name: Upload the dashboard screenshots
        if: always() && needs.scan.outputs.run_dashboard == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dashboard-screenshots
          path: platform/tests/e2e/screenshots/
          retention-days: 14
          if-no-files-found: ignore
      - name: Remove the image archive
        if: always()
        run: rm -f "$RUNNER_TEMP/node24.tar" "$RUNNER_TEMP/node24-opencode.tar" "$RUNNER_TEMP/gateway.tar" "$RUNNER_TEMP/tool-project-docs.tar"

  fresh-deploy:
    # E07 (D-08 E07 AC3): follows the README section "Fresh deployment (operator)" on a throw-away
    # Compose project with every server profile (core, models, platform, sandbox), from an empty
    # env file to the first intent at G1. Throw-away keys only, never printed; no GitHub secrets.
    name: fresh deployment (README)
    needs: [scan, checks]
    if: needs.scan.outputs.run_fresh_deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:fresh-deploy
      - name: Stop and remove every throw-away Compose project
        if: always()
        run: |
          for p in $(docker compose ls -a -q | grep '^sdlcfresh' || true); do
            docker compose -p "$p" down --volumes --remove-orphans || true
          done

  upgrade:
    # O02 (D-08 O02 AC1, QUESTIONS #581): follows the README section "Upgrade" on a throw-away
    # Compose project: the newest release tag before this commit (a git worktree, its published
    # images by digest) deployed with an intent at G1, then upgraded to this commit (images built
    # here) with the credentials commands of the CHANGELOG Upgrade notes; the intent goes on and the
    # audit chain verifies. Same trigger as fresh-deploy (weekly and on demand), and on every
    # pull request that changes the version (ADR-M104 §2.1): the version pull request tests its
    # own upgrade before the merge. Throw-away keys only, never printed; the images on GHCR are
    # public, so no secret.
    name: upgrade from the last release (README)
    needs: [scan, checks]
    if: needs.scan.outputs.run_fresh_deploy == 'true' || needs.scan.outputs.release_version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # the cap of every job (ci-workflow.test.ts)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the release tags: the test checks out the last one as a git worktree
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install age (the backup step)
        run: |
          archive="age-v${AGE_VERSION}-linux-amd64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" --proto '=https' --retry 3 \
            "https://github.com/FiloSottile/age/releases/download/v${AGE_VERSION}/$archive"
          echo "$AGE_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" age/age age/age-keygen
          echo "$RUNNER_TEMP/age" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:upgrade
      - name: Stop and remove every throw-away Compose project
        if: always()
        run: |
          for p in $(docker compose ls -a -q | grep '^sdlcupgrade' || true); do
            docker compose -p "$p" down --volumes --remove-orphans || true
          done

  trial-up:
    # V02 (D-08 V02 AC5): `pnpm trial:up`, the same README steps for the community trial, on a
    # throw-away Compose project to the first intent at G1, then `pnpm trial:down --wipe`. Same
    # trigger as fresh-deploy (weekly and on demand). Throw-away keys only, never printed. V08: also
    # trial:down and trial:start (the key file, a wrong and the right passphrase) on the same stack.
    name: trial set-up (pnpm trial:up)
    needs: [scan, checks]
    if: needs.scan.outputs.run_fresh_deploy == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:trial-up
      - name: Stop and remove every throw-away Compose project
        if: always()
        run: |
          for p in $(docker compose ls -a -q | grep '^sdlctrialit' || true); do
            docker compose -p "$p" down --volumes --remove-orphans || true
          done

  db:
    # Task A06: migrations and tenant isolation on a throw-away PostgreSQL (same image and init
    # script as Compose). Runs on every PR: DB code changes outside platform/deploy/ too.
    name: integration (database)
    needs: scan
    # Like checks, but a documentation-only pull request skips it. != 'false': runs when scan
    # could not decide.
    if: ${{ !cancelled() && needs.scan.outputs.run_db != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Database tests (fail if no database is available)
        run: pnpm test:db
      # X04 PR 3a: the pgvector adapter on a throw-away knowledge-db (ADR-M89).
      - name: Index store tests (knowledge-db)
        run: pnpm test:knowledge
      # Task B07: the intent workflow on the Temporal test server (pinned by version and SHA-256 in
      # the script; the cached archive is checked again on every run, QUESTIONS #92).
      - name: Cache the Temporal test server archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/sdlc/temporal-test-server
          key: temporal-test-server-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platform/deploy/scripts/temporal-test-server.sh') }}
      - name: Intent workflow tests (Temporal test server + database)
        run: pnpm test:workflow

  release-images:
    # V15 (ADR-M94 §2.5): a version pull request builds and scans the six release images on both
    # architectures with the release's own workflow, and pushes nothing. release-images-scan.yml
    # only reads, so this job widens no permission.
    needs: [scan, checks]
    if: needs.scan.outputs.release_version != ''
    uses: ./.github/workflows/release-images-scan.yml
    with:
      version: ${{ needs.scan.outputs.release_version }}

  ci-ok:
    name: ci-ok
    needs:
      [
        scan,
        checks,
        compose,
        runner-rootless,
        sandbox-image,
        fresh-deploy,
        upgrade,
        trial-up,
        db,
        release-images,
      ]
    # The summary for pull requests (the future required check). Scheduled runs need no summary:
    # a failed job there already marks the run red.
    if: ${{ always() && github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All jobs passed or were skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success | skipped) ;;
              *) echo "::error::a CI job ended with '$result'"; exit 1 ;;
            esac
          done
