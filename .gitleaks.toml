# Gitleaks configuration (task A09). Uses the default rules; every finding blocks CI.
#
# Accepted exceptions: add an allowlist entry below only with a reason, a date and
# Person B's approval in the pull request. Never allow-list a real secret: rotate it.

[extend]
useDefault = true

# Approved by: Harry (Person B), 2026-09-25, PR #50.
# False positive: the Docker image name valkey/valkey:<version tag> contains "key", so
# generic-api-key reads the tag as a key value. Only lines that name this image are skipped;
# a real key elsewhere on such a line (e.g. in a trailing comment) is still reported.
[[allowlists]]
description = "valkey/valkey image tag is not a secret (PR #50)"
targetRules = ["generic-api-key"]
regexTarget = "line"
regexes = ['''valkey/valkey:[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.]+)?`?\s*(\|.*)?$''']

# Approved by: Harry (Person B), 2026-09-25, PR #68 (task A04).
# False positive: the unit tests of the OpenBao client (platform/tests/secrets/) use made-up
# credentials that all contain the marker "S3CR3T", so the redaction tests can prove that no
# secret value reaches an error or a log. Only generic-api-key matches that contain the marker,
# in the .ts files of that one folder, are skipped. Any other value there is still reported.
[[allowlists]]
description = "Made-up test credentials with the S3CR3T marker in platform/tests/secrets (PR #68)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^platform/tests/secrets/[^/]+\.ts$''']
regexTarget = "match"
regexes = ['''S3CR3T''']

# Approved by: Harry (Person B), 2026-09-27, PR #90 (task B03).
# False positive: generic-api-key reads the script line `"test:api": "SDLC_API_TEST=1 …"` in
# package.json as an "api" key and its value. The line is in the history, which CI scans, so it
# cannot be renamed away without rewriting history. Only this exact line in package.json is
# skipped; any other value on it, or in any other file, is still reported.
[[allowlists]]
description = "The test:api script line in package.json is not a key (PR #90)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^package\.json$''']
regexTarget = "line"
regexes = ['''^\s*"test:api": "SDLC_API_TEST=1 vitest run --config vitest\.integration\.config\.ts platform/tests/integration/api",$''']

# Approved by: Harry (Person B), 2026-11-15, PR #541 (task H09 PR 1).
# False positive: generic-api-key reads a line of the migration lock file as a key and its value
# when the migration's file name contains a word such as "auth", "key" or "token" (here
# `0059-auth-tenant-lookups.ts`). The value is the SHA-256 of the migration file (R075), not a
# secret. Only lines of exactly that form in that one file are skipped; anything else there, or
# any other file, is still reported.
[[allowlists]]
description = "SHA-256 lines of the migration lock file are not keys (PR #541)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^platform/packages/core/src/db/migrations/migrations\.lock\.json$''']
regexTarget = "line"
regexes = ['''^\s*"[0-9]{4}-[a-z0-9-]+\.ts": "[0-9a-f]{64}",?$''']

# Platform API tokens (task B03, ADR-M26 D6; requested by Harry, 2026-09-27). Every personal API
# token starts with `sdlc_pat_` followed by 32 random bytes in base64url (43 characters), so a
# leaked token is always found, in any file type.
[[rules]]
id = "sdlc-api-token"
description = "Agentic SDLC platform API token"
regex = '''sdlc_pat_[A-Za-z0-9_-]{43}'''
keywords = ["sdlc_pat_"]

# Approved by: Harry (Person B), 2026-09-27, task B03.
# The rule's own test fixture: a clearly fake token (it contains FAKE) in one folder only. Any
# other token, or a token without the marker in that folder, is still reported.
[[allowlists]]
description = "Fake platform token fixture for the sdlc-api-token rule test (B03)"
targetRules = ["sdlc-api-token"]
condition = "AND"
paths = ['''^platform/tests/gitleaks/fixtures/[^/]+$''']
regexTarget = "match"
regexes = ['''FAKE''']

# Approved by: Harry (Person B), 2026-10-10, PR #242 (task V02 follow-up).
# False positive: the V02 redaction test (PR #236, commit 2e9f713) wrote a fake PEM block whose
# whole body is "MIIE", to prove that `trial:up` hides private keys in its output. It is in the
# history of main, which CI scans, so it cannot be removed without rewriting history. Since this
# PR the test builds the header at run time. Only private-key matches in that one test file that
# hold this exact fake body are skipped; any other key there, or anywhere else, is still reported.
[[allowlists]]
description = "Fake PEM block with the body MIIE in the trial:up redaction test (PR #236)"
targetRules = ["private-key"]
condition = "AND"
paths = ['''^platform/tests/trial/trial-up\.test\.ts$''']
regexTarget = "match"
regexes = ['''BEGIN RSA PRIVATE KEY-----\\nMIIE\\n-----END RSA PRIVATE KEY''']

# Approved by: Harry (Person B), 2026-10-24, PR #424 (task L01).
# False positive: generic-api-key reads the line below of the agent-api live test (commit 3c69cac)
# as a key: the name SDLC_AGENT_API_MODEL contains "API", and the default value is a long model
# name. It is in the history, which CI scans, so it cannot be removed without rewriting history
# (CLAUDE.md R125). The next commit keeps the model name in its own constant. Only this exact line
# in that one file is skipped; any other value on it, or in any other file, is still reported.
[[allowlists]]
description = "The SDLC_AGENT_API_MODEL default line in agent-api.test.ts is not a key (PR #424)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^platform/tests/integration/agent/agent-api\.test\.ts$''']
regexTarget = "line"
regexes = ['''^const MODEL = process\.env\.SDLC_AGENT_API_MODEL \|\| 'claude-haiku-4-5-20251001';$''']

# Approval pending: Person B (Harry) in PR #464 (task V16).
# False positive: generic-api-key reads one line of the fake env file in the server:setup unit
# test (commit c405c52) as a key: `PLATFORM_DB_PASSWORD=` followed by the made-up value
# `pw-owner-0123456789`. It is in the history, which CI scans, so it cannot be removed without
# rewriting history (CLAUDE.md R125). The next commit builds the value from a constant. Only this
# exact line in that one file is skipped; any other value on it, or in any other file, is still
# reported.
[[allowlists]]
description = "The made-up PLATFORM_DB_PASSWORD line in server-setup.test.ts is not a secret (PR #464)"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^platform/tests/deploy/server-setup\.test\.ts$''']
regexTarget = "line"
regexes = ['''^\s*'PLATFORM_DB_PASSWORD=pw-owner-0123456789',$''']
